name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing versioned tag to build and release (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve validated release target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.target.outputs.release-tag }}
      release-sha: ${{ steps.target.outputs.release-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate tag and source version
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-target.mjs

  ci:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.release-sha }}
    permissions:
      contents: read

  release:
    name: Publish ${{ needs.resolve.outputs.release-tag }}
    needs: [resolve, ci]
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release-tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository and the pinned aevra submodule
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.release-sha }}
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check file sizes
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage (85% gate)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Verify the packed package
        run: npm run test:package

      - name: Build the extension zip
        run: npm run build:extension

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$RELEASE_TAG" release-notes.md
          gh release create "$RELEASE_TAG" \
            build/aevra-browser-extension.zip \
            build/aevra-browser-extension.zip.sha256 \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
