name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository and the pinned aevra submodule
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release workflow contracts
        run: node --test scripts/release-workflows.test.mjs

      - name: Check formatting
        run: npm run format:check

      - name: Check file sizes
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage (85% gate)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Verify the packed package
        run: npm run test:package

      - name: Build the extension zip
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:extension

      - name: Upload the extension zip
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: aevra-browser-extension
          path: |
            build/aevra-browser-extension.zip
            build/aevra-browser-extension.zip.sha256
          if-no-files-found: error
